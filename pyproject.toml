[project]
name = "evie"
version = "0.1.0"
description = "Evie: Isaac's voice-run operating system"
readme = "README.md"
authors = [
    { name = "Isaac Miranda", email = "isaacmirandaofficial@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
  "mlx-whisper>=0.4.3",
  "claude-agent-sdk>=0.2.158",
  "websockets>=17.1",
  "pocket-tts>=3.1.0",
  "sounddevice>=0.5.6",
  "sherpa-onnx>=1.13.8",
  "sherpa-onnx-core==1.13.8",
  "holidays>=0.105",
]

[project.scripts]
evie-core = "evie.server:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the real Jev API (about $0.00003 per call)"]
addopts = "-m 'not live'"
